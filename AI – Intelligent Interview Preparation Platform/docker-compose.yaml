services:

  api:
    image: interview-app:dev
    build:
      context: ./backend
      dockerfile: docker/dev/Dockerfile

    container_name: interview-api

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: interview-postgres

    environment:
      POSTGRES_DB: interviewgpt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/interview-ui
      dockerfile: Dockerfile

    container_name: interview-frontend

    command: npm run dev -- --host 0.0.0.0

    ports:
      - "5173:5173"

    volumes:
      - ./frontend/interview-ui:/app
      - /app/node_modules

    depends_on:
      - api

    restart: unless-stopped

volumes:
  postgres_data: