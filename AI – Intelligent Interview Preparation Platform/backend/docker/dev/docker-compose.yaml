version: "3.9"

services:

  api:
    image: interview-app:dev
    build:
      context: ../..
      dockerfile: Dockerfile

    container_name: interview-api

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

    env_file:
      - ../../.env

    volumes:
      - .:/app:delegated

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped

  worker:
    image: interview-app:dev

    container_name: interview-worker

    command: >
      celery -A app.worker.celery_app worker --pool=prefork --loglevel=info --concurrency=8

    env_file:
      - ../../.env

    volumes:
      - .:/app:delegated

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped

  beat:
    image: interview-app:dev

    container_name: interview-beat

    command: >
      celery -A app.worker.celery_app beat --loglevel=info

    env_file:
      - ../../.env

    volumes:
      - .:/app:delegated

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: interview-postgres

    environment:
      POSTGRES_DB: interviewgpt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  redis:
    image: redis:7

    container_name: interview-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

volumes:
  postgres_data: