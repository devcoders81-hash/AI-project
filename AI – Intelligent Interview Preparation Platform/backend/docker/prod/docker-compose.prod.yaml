services:

  api:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile

    command: celery -A app.worker.celery_app worker --loglevel=info

    restart: always

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile

    command: celery -A app.worker.celery_app beat --loglevel=info

    restart: always

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_DB: interviewgpt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    restart: always

volumes:
  postgres_data: